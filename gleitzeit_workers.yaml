# Gleitzeit Configuration with Workers Enabled
redis:
  mode: single
  single_node:
    host: localhost
    port: 6379
    db: 0

serve:
  api:
    enabled: true
    host: 0.0.0.0
    port: 8000
  ui:
    enabled: true
    host: 0.0.0.0
    port: 8004
  dev_mode: false

workers:
  task_execution:
    enabled: true
    count: 2
    worker_class: gleitzeit.workers.task_execution_worker.TaskExecutionWorker
    max_concurrent: 10
    batch_size: 10
    block_timeout: 5000

  dependency:
    enabled: true
    count: 1
    worker_class: gleitzeit.workers.dependency_worker.DependencyWorker
    max_concurrent: 10
    batch_size: 10
    block_timeout: 5000

  workflow_loader:
    enabled: true
    count: 2
    worker_class: gleitzeit.workers.workflow_loader_worker_v2.WorkflowLoaderWorkerV2
    max_concurrent: 10
    batch_size: 10
    block_timeout: 5000

  workflow_submission:
    enabled: true
    count: 1
    worker_class: gleitzeit.workers.workflow_submission_worker.WorkflowSubmissionWorker
    max_concurrent: 5
    batch_size: 5
    block_timeout: 5000

  retry:
    enabled: true
    count: 1
    worker_class: gleitzeit.workers.retry_worker.RetryWorker
    max_concurrent: 10
    batch_size: 10
    block_timeout: 5000

auth:
  auto_login: true
  jwt:
    secret: ${JWT_SECRET:-dev-secret-change-me}
    algorithm: HS256

security:
  cors:
    additional_origins: ""