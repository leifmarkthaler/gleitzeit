name: test_python_workflow
description: Simple test workflow using Python tasks

tasks:
  - id: task1
    type: python
    name: "First Task"
    code: |
      print('Task 1 executed successfully')

  - id: task2
    type: python
    name: "Second Task"
    code: |
      print('Task 2 executed successfully')
    depends_on:
      - task1

  - id: task3
    type: python
    name: "Final Task"
    code: |
      print('Workflow completed!')
    depends_on:
      - task2

on_success:
  - type: log
    message: "Test workflow completed successfully!"

on_failure:
  - type: log
    message: "Test workflow failed!"