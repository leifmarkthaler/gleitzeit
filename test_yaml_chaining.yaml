name: test-yaml-chaining
description: Test result chaining with YAML workflow (not Easy Client)

tasks:
  - name: generate
    protocol: python/v1
    method: python/execute
    params:
      code: |
        result = {
            'number': 42,
            'message': 'Hello from generate task'
        }
        print(f'Generated: {result}')

  - name: process
    protocol: python/v1
    method: python/execute
    params:
      inputs:
        generate: ${generate.result}
      code: |
        print(f'Type of inputs: {type(inputs)}')
        print(f'Value of inputs: {inputs}')

        # Try to get generate from inputs
        if isinstance(inputs, dict):
            generate_data = inputs.get('generate', {})
        else:
            generate_data = inputs

        print(f'Type of generate_data: {type(generate_data)}')
        print(f'Value of generate_data: {generate_data}')

        result = {
            'doubled': generate_data.get('number', 0) * 2 if isinstance(generate_data, dict) else 0,
            'response': f"Processed: {generate_data.get('message', 'none') if isinstance(generate_data, dict) else 'none'}"
        }
        print(f'Processed result: {result}')
    dependencies:
      - generate
