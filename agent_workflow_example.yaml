name: "Agent Research Workflow"
description: "Autonomous research with self-directed planning and execution"

tasks:
  # Single autonomous research task
  - id: "comprehensive_research"
    protocol: "agent/v1"
    method: "research"
    params:
      topic: "Rust programming language - fundamentals, ecosystem, use cases, and practical examples"
      max_steps: 8

  # Code generation with automatic testing
  - id: "create_example_code"
    protocol: "agent/v1"
    method: "code"
    dependencies: ["comprehensive_research"]
    params:
      task: "Create a comprehensive Rust example demonstrating ownership, borrowing, error handling, and key language features based on the research findings"
      language: "rust"
      context: "${comprehensive_research.report}"

  # Documentation creation with conversation context
  - id: "create_tutorial"
    protocol: "agent/v1"
    method: "analyze"
    dependencies: ["comprehensive_research", "create_example_code"]
    params:
      content: |
        Research Report: ${comprehensive_research.report}
        
        Example Code: ${create_example_code.code}
        Code Explanation: ${create_example_code.explanation}
      question: "Create a comprehensive tutorial that combines this research and code into a beginner-friendly learning resource with clear explanations and practical examples."

  # Interactive review and refinement
  - id: "review_and_refine"
    protocol: "agent/v1"
    method: "chat"
    dependencies: ["create_tutorial"]
    params:
      message: "Review the tutorial and suggest specific improvements for clarity, completeness, and educational value. Focus on areas that might confuse beginners."
      session_id: "rust_tutorial_session"

  # Final polishing
  - id: "final_polish"
    protocol: "agent/v1"
    method: "chat"
    dependencies: ["review_and_refine"]
    params:
      message: "Apply the suggested improvements to create the final polished version of the Rust tutorial."
      session_id: "rust_tutorial_session"