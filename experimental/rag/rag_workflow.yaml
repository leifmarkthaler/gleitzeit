name: "RAG Document Q&A Workflow"
description: "Ingest documents and answer questions using RAG"

tasks:
  # Step 1: Ingest documents from a directory
  - id: "ingest_docs"
    method: "rag/ingest_directory"
    parameters:
      directory: "./documents"
      pattern: "*.txt"
  
  # Step 2: Ask a question about the documents
  - id: "query_1"
    method: "rag/query"
    dependencies: ["ingest_docs"]
    parameters:
      query: "What are the main topics discussed in these documents?"
      use_context: true
  
  # Step 3: Follow-up question using previous response
  - id: "query_2"
    method: "rag/query"
    dependencies: ["query_1"]
    parameters:
      query: "Can you provide more details about ${query_1.result.response}?"
      use_context: true
  
  # Step 4: Query without context for comparison
  - id: "query_no_context"
    method: "rag/query"
    dependencies: ["ingest_docs"]
    parameters:
      query: "What are the main topics discussed in these documents?"
      use_context: false
  
  # Step 5: Compare responses
  - id: "compare_responses"
    method: "python/execute"
    dependencies: ["query_1", "query_no_context"]
    parameters:
      code: |
        with_context = """${query_1.result.response}"""
        without_context = """${query_no_context.result.response}"""
        
        print("Response WITH context:")
        print(with_context[:500])
        print("\n" + "="*50 + "\n")
        print("Response WITHOUT context:")
        print(without_context[:500])
        
        # Simple similarity check
        common_words = set(with_context.lower().split()) & set(without_context.lower().split())
        similarity = len(common_words) / max(len(with_context.split()), len(without_context.split()))
        
        result = {
            'similarity_score': similarity,
            'context_improved': len(with_context) > len(without_context),
            'sources_used': ${query_1.result.sources | length}
        }