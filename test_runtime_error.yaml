name: runtime_error_workflow
description: Test workflow with runtime errors

tasks:
  - id: task1
    name: This task will succeed
    handler: python
    method: python/execute
    params:
      code: |
        print("Task 1 starting...")
        result = {"status": "ok", "value": 42}

  - id: task2
    name: This task will fail
    handler: python
    method: python/execute
    depends_on:
      - task1
    params:
      code: |
        print("Task 2 starting...")
        # This will cause a runtime error
        x = 1 / 0
        result = {"status": "never reached"}

  - id: task3
    name: This depends on failed task
    handler: python
    method: python/execute
    depends_on:
      - task2
    params:
      code: |
        print("Task 3 - should not run")
        result = {"status": "skipped"}