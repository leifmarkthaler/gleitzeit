name: malformed_workflow
description: This workflow has intentional errors

tasks:
  - id: task1
    name: Missing handler field
    method: python/execute
    # Missing 'handler' field which is required
    params:
      code: print("This won't run")

  - id: task2
    name: Invalid dependency
    handler: python
    method: python/execute
    depends_on:
      - nonexistent_task  # This task doesn't exist
    params:
      code: print("Task 2")

  - id: task3
    name: Invalid method
    handler: python
    method: invalid/method  # This method doesn't exist
    params:
      code: print("Task 3")

  # Duplicate task ID
  - id: task1
    name: Duplicate ID
    handler: python
    method: python/execute
    params:
      code: print("Duplicate")