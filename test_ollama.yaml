workflow:
  id: test-ollama-handler
  name: Test Ollama Handler
  description: Test that Ollama handler is working with configurations
  tasks:
    - id: ask-llama
      type: ollama
      params:
        model: llama3.2:latest
        prompt: "Write a haiku about distributed systems"
        options:
          temperature: 0.7
          max_tokens: 100

schedule:
  type: once
