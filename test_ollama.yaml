name: ollama-test
version: 1.0
description: Test Ollama LLM integration

tasks:
  - id: generate_joke
    type: ollama
    model: llama3.1:latest
    prompt: "Tell me a short joke about computers. Keep it under 50 words."
    temperature: 0.7
    max_tokens: 100

  - id: analyze_joke
    type: ollama
    model: llama3.1:latest
    prompt: |
      The joke was: ${generate_joke.response}

      Rate this joke on a scale of 1-10 and explain why in one sentence.
    temperature: 0.5
    max_tokens: 100
    dependencies:
      - generate_joke

  - id: summary
    type: python
    code: |
      joke = inputs.get("generate_joke", {})
      analysis = inputs.get("analyze_joke", {})

      result = {
        "joke": joke.get("response", "No joke generated"),
        "analysis": analysis.get("response", "No analysis"),
        "model_used": joke.get("model", "unknown"),
        "timestamp": joke.get("created_at", "unknown")
      }
    dependencies:
      - generate_joke
      - analyze_joke