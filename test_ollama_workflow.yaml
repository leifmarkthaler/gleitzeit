name: test-ollama-workflow
tasks:
  - id: ollama_task_1
    protocol: ollama/v1
    method: ollama/generate
    params:
      model: llama3.2:latest
      prompt: "What is 2+2? Answer in one short sentence."
      temperature: 0.7

  - id: ollama_task_2
    protocol: ollama/v1
    method: ollama/generate
    params:
      model: llama3.2:latest
      prompt: "What is the capital of France? Answer in one word."
      temperature: 0.7
    dependencies: [ollama_task_1]
