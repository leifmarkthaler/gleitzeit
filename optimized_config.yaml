# Optimized Gleitzeit Configuration for Performance

redis:
  mode: single
  single_node:
    host: localhost
    port: 6379
    # Connection pool settings
    max_connections: 100
    socket_keepalive: true
    socket_keepalive_options:
      TCP_KEEPIDLE: 30
      TCP_KEEPINTVL: 10
      TCP_KEEPCNT: 3

workers:
  # Task execution workers - increased count and concurrency
  - worker_type: task_execution
    worker_class: gleitzeit.workers.task_execution_worker.TaskExecutionWorker
    count: 4  # Doubled from 2
    max_concurrent: 10  # Doubled from 5
    batch_size: 20  # Increased from default 10
    block_timeout: 1000  # Reduced from 5000ms for faster response

  # Dependency workers - added second worker
  - worker_type: dependency
    worker_class: gleitzeit.workers.dependency_worker.DependencyWorker
    count: 2  # Doubled from 1
    max_concurrent: 20  # Doubled from 10
    batch_size: 20  # Increased for batch processing
    block_timeout: 1000

  # Workflow loader - added second loader
  - worker_type: workflow_loader_v2
    worker_class: gleitzeit.workers.workflow_loader_worker_v2.WorkflowLoaderWorkerV2
    count: 2  # Doubled from 1
    max_concurrent: 10  # Doubled from 5
    batch_size: 10
    block_timeout: 1000

# Task execution settings
task_execution:
  # Default retry configuration for all tasks
  default_retry:
    max_attempts: 2          # Total attempts (1 initial + 1 retry)
    strategy: exponential    # exponential, linear, or fixed
    base_delay: 1.0          # Base delay in seconds
    max_delay: 30.0          # Maximum delay in seconds
    multiplier: 2.0          # Multiplier for exponential backoff

  # Non-retryable error patterns
  non_retryable_errors:
    - "INVALID_PARAMS"
    - "Missing required parameter"
    - "validation"
    - "invalid"

# Performance tuning
performance:
  # Subprocess pooling for Python tasks
  python_subprocess_pool_size: 10

  # Caching
  workflow_cache_size: 1000
  workflow_cache_ttl: 3600  # 1 hour
  dependency_cache_size: 500
  dependency_cache_ttl: 1800  # 30 minutes

  # Stream management
  stream_max_length: 10000
  stream_trim_interval: 60  # seconds

  # Event batching
  event_batch_size: 50
  event_batch_timeout: 100  # ms

# Monitoring settings
monitoring:
  metrics_enabled: true
  metrics_interval: 10  # seconds
  health_check_interval: 30  # seconds

# Handler optimizations
handlers:
  python:
    subprocess_pool_enabled: true
    subprocess_pool_size: 10
    default_timeout: 300

  shell:
    concurrent_limit: 20
    default_timeout: 300

  http:
    connection_pool_size: 50
    request_timeout: 30
    max_retries: 3

  ollama:
    concurrent_limit: 5  # LLM calls are expensive
    default_timeout: 120
    connection_pool_size: 10