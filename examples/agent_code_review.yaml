name: "Automated Code Review Pipeline"
description: "Uses agents to review and improve code"

# Workflow that:
# 1. Analyzes existing code
# 2. Suggests improvements
# 3. Generates improved version
# 4. Tests the improvements

parameters:
  original_code: |
    def fibonacci(n):
        if n <= 1:
            return n
        else:
            return fibonacci(n-1) + fibonacci(n-2)
    
    # Test
    for i in range(10):
        print(fibonacci(i))

tasks:
  # Analyze the original code
  - id: "code_analysis"
    method: "agent/analyze"
    parameters:
      content: "${original_code}"
      question: |
        Analyze this Python code for:
        1. Performance issues
        2. Code quality
        3. Best practices
        4. Potential bugs
        Provide specific improvement suggestions.
    description: "Analyze original code"
  
  # Generate improved version
  - id: "improve_code"
    method: "agent/code"
    dependencies: ["code_analysis"]
    parameters:
      task: |
        Improve the fibonacci function based on these issues:
        ${code_analysis.analysis}
        
        Requirements:
        - Fix performance issues
        - Add proper documentation
        - Include error handling
        - Add type hints
      language: "python"
    description: "Generate improved code"
  
  # Compare performance
  - id: "performance_test"
    method: "agent/code"
    dependencies: ["improve_code"]
    parameters:
      task: |
        Create a performance comparison script that:
        1. Times the original fibonacci function
        2. Times the improved version
        3. Shows the performance difference
        
        Original code:
        ${original_code}
        
        Improved code:
        ${improve_code.code}
      language: "python"
    description: "Create performance comparison"
  
  # Final review
  - id: "final_review"
    method: "agent/analyze"
    dependencies: ["code_analysis", "improve_code", "performance_test"]
    parameters:
      content: |
        Original Analysis:
        ${code_analysis.analysis}
        
        Improved Code:
        ${improve_code.code}
        
        Performance Test:
        ${performance_test.code}
        
        Test Results:
        ${performance_test.test_result}
      question: "Provide a final code review summary with key improvements made and remaining considerations"
    description: "Final comprehensive review"

output:
  format: "markdown"
  fields:
    - original_analysis: "${code_analysis.analysis}"
    - improved_code: "${improve_code.code}"
    - improvement_explanation: "${improve_code.explanation}"
    - performance_comparison: "${performance_test.code}"
    - test_results: "${performance_test.test_result}"
    - final_review: "${final_review.analysis}"