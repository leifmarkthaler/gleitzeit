name: circuit-breaker-demo
description: Demonstrates circuit breaker protecting external service calls

# Workflow configuration
config:
  handlers:
    # Configure Ollama handler with circuit breaker
    ollama:
      base_url: "http://localhost:11434"
      timeout: 30
      circuit_breaker:
        failure_threshold: 3      # Open after 3 failures
        success_threshold: 2       # Close after 2 successes in half-open
        reset_timeout: 60         # Try half-open after 60 seconds
        half_open_max_calls: 2    # Max 2 test calls in half-open state

tasks:
  # This task will be protected by circuit breaker
  - id: generate_text_1
    method: ollama/generate
    params:
      model: llama2
      prompt: "Write a haiku about circuit breakers in software"
      options:
        temperature: 0.7
        max_tokens: 50

  # Another task - will fail fast if circuit is open
  - id: generate_text_2
    method: ollama/generate
    params:
      model: llama2
      prompt: "Explain what a circuit breaker pattern is"
    dependencies: [generate_text_1]

  # Yet another - demonstrates fast fail when service is down
  - id: generate_text_3
    method: ollama/generate
    params:
      model: llama2
      prompt: "Why use circuit breakers?"
    dependencies: [generate_text_2]

  # Log the results
  - id: log_results
    method: python/exec
    params:
      code: |
        import json
        results = {
            'text_1': workflow.get_task_result('generate_text_1'),
            'text_2': workflow.get_task_result('generate_text_2'),
            'text_3': workflow.get_task_result('generate_text_3')
        }
        print(json.dumps(results, indent=2))
    dependencies: [generate_text_3]

# Expected behavior:
#
# When Ollama is running normally:
# - All tasks complete successfully
# - Circuit breaker remains closed
#
# When Ollama is down:
# - First task attempts and fails (counts as 1 failure)
# - Retries fail (counts up to failure_threshold)
# - Circuit breaker opens
# - Subsequent tasks fail immediately with "Circuit breaker open"
# - No unnecessary waiting or connection attempts
# - Workflow fails fast
#
# After Ollama comes back up:
# - After reset_timeout (60s), circuit enters half-open state
# - Next workflow attempts test the connection
# - After success_threshold successes, circuit closes
# - Normal operation resumes