name: "Agent-Powered Research Pipeline"
description: "Demonstrates agent capabilities for research, code generation, and analysis"

# Workflow that uses agents to:
# 1. Research a topic
# 2. Generate code based on findings
# 3. Analyze the results

tasks:
  # Research phase
  - id: "research_quantum"
    method: "agent/research"
    parameters:
      topic: "quantum computing error correction techniques"
      max_steps: 8
      session_id: "quantum_research_001"
    description: "Research quantum error correction methods"
  
  # Code generation based on research
  - id: "implement_code"
    method: "agent/code"
    dependencies: ["research_quantum"]
    parameters:
      task: "Implement a simple quantum error correction simulator"
      context: "${research_quantum.report}"
      language: "python"
    description: "Generate code based on research findings"
  
  # Analysis of implementation
  - id: "analyze_implementation"
    method: "agent/analyze"
    dependencies: ["research_quantum", "implement_code"]
    parameters:
      content: |
        Research Report:
        ${research_quantum.report}
        
        Implementation:
        ${implement_code.code}
      question: "Evaluate the accuracy and completeness of the implementation compared to the research findings"
    description: "Analyze how well the code implements the research"
  
  # Final synthesis
  - id: "final_report"
    method: "llm/chat"
    dependencies: ["research_quantum", "implement_code", "analyze_implementation"]
    parameters:
      model: "llama3.2"
      messages:
        - role: "system"
          content: "You are a technical report writer"
        - role: "user"
          content: |
            Create a comprehensive final report that includes:
            
            1. Research Summary:
            ${research_quantum.report}
            
            2. Implementation:
            ${implement_code.code}
            
            3. Code Explanation:
            ${implement_code.explanation}
            
            4. Analysis:
            ${analyze_implementation.analysis}
            
            Structure this as a professional technical report with:
            - Executive Summary
            - Research Findings
            - Implementation Details
            - Evaluation
            - Conclusions
    description: "Generate final comprehensive report"

output:
  format: "markdown"
  fields:
    - research_report: "${research_quantum.report}"
    - generated_code: "${implement_code.code}"
    - code_test_result: "${implement_code.test_result}"
    - analysis: "${analyze_implementation.analysis}"
    - final_report: "${final_report.response}"