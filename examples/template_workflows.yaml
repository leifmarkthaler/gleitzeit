name: "Template Workflow Examples"
description: "Demonstration of workflow template generation capabilities"
tasks:
  - id: "template_research_task"
    name: "Research Workflow Orchestration"
    protocol: "template/v1"
    method: "template/research"
    params:
      topic: "workflow orchestration systems"
      depth: "medium"
      max_steps: 5
    priority: "high"
    retry:
      max_attempts: 2
      base_delay: 10.0

  - id: "template_code_task"
    name: "Generate Python Calculator"
    protocol: "template/v1"
    method: "template/code"
    params:
      task: "Create a scientific calculator class with basic and advanced operations"
      language: "python"
    priority: "normal"
    dependencies: ["template_research_task"]

  - id: "template_analysis_task"
    name: "Analyze Research Results"
    protocol: "template/v1"
    method: "template/analyze"
    params:
      content: "${template_research_task.report}"
      question: "What are the key benefits and challenges of workflow orchestration?"
    priority: "normal"
    dependencies: ["template_research_task"]

  - id: "template_chat_task"
    name: "Summarize Findings"
    protocol: "template/v1"
    method: "template/chat"
    params:
      message: "Based on the research and analysis, provide a concise summary of workflow orchestration best practices"
      session_id: "example_session"
    priority: "low"
    dependencies: ["template_analysis_task"]