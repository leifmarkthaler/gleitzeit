name: Test Workflow
tasks:
  - id: python-task
    name: Execute Python
    protocol: python/v1
    method: python/execute
    params:
      file: test_hello.py
      
  - id: llm-task
    name: Generate Text
    protocol: llm/v1
    method: llm/generate
    params:
      model: llama5
      prompt: "Say hello in one sentence."