# Production overrides for docker-compose.yml
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up

version: '3.8'

services:
  redis:
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-changeme}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-changeme}
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  api:
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changeme}@redis:6379
      - LOG_LEVEL=WARNING
      - ENVIRONMENT=production
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET=${JWT_SECRET}
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
    volumes:
      - logs:/app/logs
      # Remove source mount in production

  ui:
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changeme}@redis:6379
      - LOG_LEVEL=WARNING
      - ENVIRONMENT=production
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    volumes:
      - logs:/app/logs
      # Remove source mount in production

  worker-task:
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changeme}@redis:6379
      - LOG_LEVEL=WARNING
      - ENVIRONMENT=production
    deploy:
      replicas: 10
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  worker-executor:
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changeme}@redis:6379
      - LOG_LEVEL=WARNING
      - ENVIRONMENT=production
    deploy:
      replicas: 5
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  worker-workflow:
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changeme}@redis:6379
      - LOG_LEVEL=WARNING
      - ENVIRONMENT=production
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '1'
          memory: 512M

  # Single instance workers with leader election
  worker-scheduler:
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changeme}@redis:6379
      - LOG_LEVEL=WARNING
      - ENVIRONMENT=production
      - USE_LEADER_ELECTION=true
    deploy:
      replicas: 2  # For redundancy, but only one will be active

  worker-monitor:
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changeme}@redis:6379
      - LOG_LEVEL=WARNING
      - ENVIRONMENT=production
    deploy:
      replicas: 1