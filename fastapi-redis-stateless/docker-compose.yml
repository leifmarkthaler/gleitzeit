version: "3.9"
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes:
      - redis-data:/data

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    ports: ["8000:8000"]
    depends_on: [redis]
    volumes:
      - ./:/code
    working_dir: /code

  worker:
    build: .
    command: python -m app.worker
    env_file: .env
    depends_on: [redis]
    volumes:
      - ./:/code
    working_dir: /code

volumes:
  redis-data:
