name: test_mixed_mode
version: "1.0"
triggers:
  - type: manual
tasks:
  - id: python_task
    type: python
    config:
      code: |
        import os
        import socket

        # Check if we're in a Docker container
        is_docker = os.path.exists('/.dockerenv') or os.environ.get('CONTAINER') == 'docker'

        print(f"Python execution environment:")
        print(f"  In Docker: {is_docker}")
        print(f"  Hostname: {socket.gethostname()}")
        print(f"  Python path: {os.sys.executable}")

        return {
            "in_docker": is_docker,
            "hostname": socket.gethostname(),
            "python_path": os.sys.executable
        }

  - id: timer_task
    type: timer
    config:
      duration: 1
    dependencies:
      - python_task

  - id: signal_task
    type: signal
    config:
      signal: test_signal
    dependencies:
      - timer_task
