name: File Input Ollama Workflow
version: 1.0
description: Process files using Ollama with automatic file loading

tasks:
  # First load the input file
  - id: load_document
    type: file
    protocol: file/v1
    method: file/load
    params:
      path: "input_file.txt"
      encoding: utf-8
      cache: true

  # Load an image if we have one
  - id: load_image
    type: file
    protocol: file/v1
    method: file/load
    params:
      path: "sample_image.png"
      as_base64: true
      cache: true

  # Summarize the document content
  - id: summarize_document
    type: ollama
    protocol: ollama/v1
    method: ollama/generate
    params:
      model: llama3.2
      prompt: |
        Please summarize the following document in 2-3 sentences:

        ${load_document.content}
      options:
        temperature: 0.3
        num_predict: 100
    dependencies:
      - load_document

  # Extract keywords from the document
  - id: extract_keywords
    type: ollama
    protocol: ollama/v1
    method: ollama/generate
    params:
      model: llama3.2
      prompt: |
        Extract 5 key terms from this document as a bulleted list:

        ${load_document.content}
      options:
        temperature: 0.2
        num_predict: 80
    dependencies:
      - load_document

  # Analyze the image if available
  - id: analyze_image
    type: ollama
    protocol: ollama/v1
    method: ollama/generate
    params:
      model: llava
      prompt: "Describe what you see in this image."
      images:
        - "${load_image.content}"
      options:
        temperature: 0.3
        num_predict: 150
    dependencies:
      - load_image

  # Create a final report combining document and image analysis
  - id: create_report
    type: ollama
    protocol: ollama/v1
    method: ollama/chat
    params:
      model: llama3.2
      messages:
        - role: system
          content: "You are a helpful assistant that creates comprehensive reports."
        - role: user
          content: |
            Create a brief report based on the following analysis:

            Document Summary: ${summarize_document.response}
            Key Terms: ${extract_keywords.response}
            Image Description: ${analyze_image.response}

            Provide a cohesive 2-paragraph summary.
      options:
        temperature: 0.5
        num_predict: 200
    dependencies:
      - summarize_document
      - extract_keywords
      - analyze_image

  # List files in current directory
  - id: list_files
    type: file
    protocol: file/v1
    method: file/list
    params:
      directory: "."
      pattern: "*.txt"
      recursive: false