name: "Python Security Test"
description: "Test Python handler with unified file security validation"
version: "1.0.0"

tasks:
  - id: "run_hello_world"
    name: "Run Hello World Script"
    type: "python"
    method: "python/exec_file"
    params:
      file_path: "hello_world.py"

  - id: "test_path_traversal"
    name: "Test Path Traversal (Should Fail)"
    type: "python"
    method: "python/exec_file"
    params:
      file_path: "../../../etc/passwd"
    dependencies: ["run_hello_world"]