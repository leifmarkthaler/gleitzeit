version: '3.8'

# Observability Stack: Loki + Grafana + Prometheus
# This extends the main docker-compose.yml
# Usage: docker-compose -f docker-compose.yml -f docker-compose.observability.yml up

networks:
  gleitzeit:
    external: true
    name: gleitzeit_network

volumes:
  loki-data:
    name: gleitzeit_loki_data
  grafana-data:
    name: gleitzeit_grafana_data
  prometheus-data:
    name: gleitzeit_prometheus_data

services:
  # Loki - Log Aggregation
  loki:
    image: grafana/loki:2.9.3
    container_name: gleitzeit_loki
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
      - ./config/loki-config.yaml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - gleitzeit
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Grafana - Visualization
  grafana:
    image: grafana/grafana:10.2.3
    container_name: gleitzeit_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=gleitzeit
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_INSTALL_PLUGINS=redis-datasource
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - gleitzeit
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Prometheus - Metrics Collection
  prometheus:
    image: prom/prometheus:v2.48.1
    container_name: gleitzeit_prometheus
    ports:
      - "9090:9090"
    volumes:
      - prometheus-data:/prometheus
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - gleitzeit
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Loki Exporter - Export logs from Redis to Loki
  loki-exporter:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: gleitzeit_loki_exporter
    command: ["python", "-m", "gleitzeit.workers.loki_exporter_worker",
              "--redis-url", "redis://redis:6379",
              "--loki-url", "http://loki:3100",
              "--batch-size", "100",
              "--poll-interval", "5",
              "--worker-id", "loki-exporter"]
    environment:
      - REDIS_URL=redis://redis:6379
      - LOKI_URL=http://loki:3100
      - LOG_LEVEL=INFO
      - ENVIRONMENT=docker
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - gleitzeit
    restart: unless-stopped
