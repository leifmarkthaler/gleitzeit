# NGINX configuration for Gleitzeit with WebSocket support
# This configuration provides load balancing and WebSocket proxying

upstream gleitzeit_backend {
    # Load balancing between multiple Gleitzeit instances
    # Use ip_hash for session affinity (important for WebSockets)
    ip_hash;
    
    server gleitzeit-api:8000 weight=3;
    server gleitzeit-worker-1:8001 weight=1;
    server gleitzeit-worker-2:8002 weight=1;
    
    # Keep connections alive
    keepalive 64;
}

# Map to determine WebSocket upgrade
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name gleitzeit.local localhost;

    # General proxy settings
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # WebSocket specific settings
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    
    # Timeouts for WebSocket connections
    proxy_connect_timeout 7d;
    proxy_send_timeout 7d;
    proxy_read_timeout 7d;
    
    # Disable buffering for WebSocket
    proxy_buffering off;
    
    # API routes
    location / {
        proxy_pass http://gleitzeit_backend;
        
        # Standard HTTP
        proxy_set_header Connection "";
    }
    
    # WebSocket endpoints
    location ~ ^/events/(test|stream)$ {
        proxy_pass http://gleitzeit_backend;
        
        # WebSocket upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        # Disable buffering for real-time communication
        proxy_buffering off;
        proxy_cache off;
        
        # Longer timeouts for WebSocket
        proxy_connect_timeout 1d;
        proxy_send_timeout 1d;
        proxy_read_timeout 1d;
    }
    
    # UI WebSocket endpoints
    location ~ ^/(ws|ws/logs|ws/updates)$ {
        proxy_pass http://gleitzeit_backend;
        
        # WebSocket upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        # Disable buffering
        proxy_buffering off;
        proxy_cache off;
        
        # Longer timeouts
        proxy_connect_timeout 1d;
        proxy_send_timeout 1d;
        proxy_read_timeout 1d;
    }
    
    # Health check endpoint (no auth required)
    location /system/health {
        proxy_pass http://gleitzeit_backend;
        access_log off;
    }
    
    # Prometheus metrics endpoint
    location /system/metrics/prometheus {
        proxy_pass http://gleitzeit_backend;
        
        # Restrict access to monitoring systems
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;
    }
    
    # Static files (if any)
    location /static/ {
        alias /app/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript 
               application/javascript application/json application/xml+rss;
}

