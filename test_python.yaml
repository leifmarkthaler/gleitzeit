name: test-python-execution
description: Test Python handler execution mode

tasks:
  - id: simple_calculation
    name: Simple Math
    type: python
    params:
      code: |
        import sys
        import os
        print(f"Python version: {sys.version}")
        print(f"Running in PID: {os.getpid()}")
        print(f"Environment: {os.environ.get('CONTAINER_RUNTIME', 'native')}")
        result = 2 + 2
        print(f"Calculation result: {result}")

  - id: check_docker
    name: Check Docker Environment
    type: python
    params:
      code: |
        import os
        import socket
        hostname = socket.gethostname()
        print(f"Hostname: {hostname}")
        print(f"Working directory: {os.getcwd()}")

        # Check if running in Docker
        is_docker = os.path.exists('/.dockerenv')
        print(f"Running in Docker: {is_docker}")

        result = f"Environment check complete - Docker: {is_docker}"