<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Gleitzeit UI{% endblock %}</title>
    
    <!-- CSS -->
    <link rel="stylesheet" href="/static/css/main.css?v=5">
    
    <!-- HTMX for dynamic updates -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    
    <!-- HTMX WebSocket extension -->
    <script src="https://unpkg.com/htmx.org/dist/ext/ws.js"></script>
    
    <!-- Chart.js for visualizations -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    {% block head %}{% endblock %}
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <a href="/">⚡ Gleitzeit</a>
            </div>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="/" class="nav-link {% if request.url.path == '/' %}active{% endif %}">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a href="/workflows" class="nav-link {% if request.url.path.startswith('/workflows') %}active{% endif %}">Workflows</a>
                </li>
                <li class="nav-item">
                    <a href="/tasks" class="nav-link {% if request.url.path.startswith('/tasks') %}active{% endif %}">Tasks</a>
                </li>
                <li class="nav-item">
                    <a href="/queues" class="nav-link {% if request.url.path.startswith('/queues') %}active{% endif %}">Queues</a>
                </li>
                <li class="nav-item">
                    <a href="/logs" class="nav-link {% if request.url.path.startswith('/logs') %}active{% endif %}">Logs</a>
                </li>
                <li class="nav-item">
                    <a href="/errors" class="nav-link {% if request.url.path.startswith('/errors') %}active{% endif %}">Errors</a>
                </li>
                <li class="nav-item">
                    <a href="/bulk" class="nav-link {% if request.url.path.startswith('/bulk') %}active{% endif %}">Bulk Ops</a>
                </li>
            </ul>
            <div class="nav-auth">
                <span id="user-info" style="display: none;"></span>
                <a href="/login" id="login-btn" class="nav-link">Login</a>
                <button onclick="logout()" id="logout-btn" class="nav-link" style="display: none;">Logout</button>
            </div>
            <div class="nav-status">
                <div id="connection-status" class="status-indicator">
                    <span class="status-dot"></span>
                    <span class="status-text">Connecting...</span>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">
            <span>Gleitzeit v0.0.6</span>
            <span>•</span>
            <span id="server-time">{{ now }}</span>
        </div>
    </footer>

    <!-- WebSocket Connection -->
    <div hx-ext="ws" ws-connect="/ws/updates" id="ws-container"></div>

    <!-- Base JavaScript -->
    <script src="/static/js/app.js"></script>
    <script src="/static/js/websocket.js"></script>
    
    <script>
    // Authentication with auto-login support
    let currentUser = null;
    
    async function checkCurrentUser() {
        try {
            // Get current user - API will auto-login as basic if needed
            const response = await fetch('/api/auth/me', {
                method: 'GET',
                credentials: 'include'  // Include session cookie
            });
            
            if (response.ok) {
                currentUser = await response.json();
                updateUserDisplay(currentUser);
            } else if (response.status === 503) {
                // Service unavailable
                console.error('Authentication service unavailable');
            }
        } catch (error) {
            console.error('Error checking current user:', error);
        }
    }
    
    function updateUserDisplay(user) {
        if (!user) return;
        
        const authElements = document.querySelector('.nav-auth');
        if (authElements) {
            // Always show auth UI
            authElements.style.display = 'flex';
            authElements.style.alignItems = 'center';
            authElements.style.gap = '10px';
        }
        
        const userInfo = document.getElementById('user-info');
        const loginBtn = document.getElementById('login-btn');
        const logoutBtn = document.getElementById('logout-btn');
        
        if (userInfo) {
            userInfo.style.display = 'inline-block';
            userInfo.textContent = `User: ${user.username || user.email}`;
            if (user.role) {
                userInfo.textContent += ` (${user.role})`;
            }
        }
        
        // Check if this is the basic user
        if (user.username === 'basic' || user.is_basic_user) {
            // Basic user - show option to login as admin
            if (loginBtn) {
                loginBtn.style.display = 'inline-block';
                loginBtn.textContent = 'Login as Admin';
            }
            if (logoutBtn) {
                logoutBtn.style.display = 'none';
            }
        } else {
            // Real user - show option to switch user
            if (loginBtn) {
                loginBtn.style.display = 'none';
            }
            if (logoutBtn) {
                logoutBtn.style.display = 'inline-block';
                logoutBtn.textContent = 'Switch User';
            }
        }
    }
    
    
    async function logout() {
        try {
            const token = localStorage.getItem('access_token');
            if (token) {
                await fetch('/api/auth/logout', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    },
                    credentials: 'include'
                });
            }
        } catch (error) {
            console.error('Logout error:', error);
        } finally {
            // Clear tokens and session
            localStorage.removeItem('access_token');
            localStorage.removeItem('refresh_token');
            
            // Clear session cookie
            document.cookie = 'session_id=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
            
            // Redirect to login page (to switch users)
            window.location.href = '/login';
        }
    }
    
    // Add auth headers and credentials to API requests
    const originalFetch = window.fetch;
    window.fetch = function(...args) {
        // Add credentials for session cookies on API requests
        if (args[0] && typeof args[0] === 'string' && args[0].startsWith('/api/')) {
            if (!args[1]) args[1] = {};
            args[1].credentials = 'include';  // Always include cookies
            
            // Add auth headers if we have a token (for real user login)
            const token = localStorage.getItem('access_token');
            if (token) {
                if (!args[1].headers) args[1].headers = {};
                args[1].headers['Authorization'] = `Bearer ${token}`;
            }
        }
        return originalFetch.apply(this, args);
    };
    
    // Check current user on page load
    document.addEventListener('DOMContentLoaded', checkCurrentUser);
    </script>
    
    {% block scripts %}{% endblock %}
</body>
</html>
