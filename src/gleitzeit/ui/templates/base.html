<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Gleitzeit{% endblock %}</title>

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://unpkg.com/htmx.org/dist/ext/ws.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/main.css?v=1">

    {% block head %}{% endblock %}
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <a href="/" class="brand-link">
                    <span class="brand-icon">🚀</span>
                    <span class="brand-text">Gleitzeit 0.0.7</span>
                </a>
            </div>

            <div class="nav-menu">
                <a href="/" class="nav-link {% if request.url.path == '/' %}active{% endif %}">Dashboard</a>
                <a href="/workflows" class="nav-link {% if 'workflows' in request.url.path %}active{% endif %}">Workflows</a>
                <a href="/tasks" class="nav-link {% if 'tasks' in request.url.path %}active{% endif %}">Tasks</a>
                <div class="nav-divider"></div>
                <span class="nav-status">
                    <span class="status-indicator" id="api-status"></span>
                    API Status
                </span>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">
            <p>Gleitzeit v{{ version }} | Session: {{ session_id[:8] if session_id else 'None' }}...</p>
        </div>
    </footer>

    <!-- WebSocket connection for real-time updates -->
    <div hx-ext="ws" ws-connect="/ws/updates" style="display: none;"></div>

    <!-- Custom JavaScript -->
    <script src="/static/js/app.js"></script>

    {% block scripts %}{% endblock %}
</body>
</html>
