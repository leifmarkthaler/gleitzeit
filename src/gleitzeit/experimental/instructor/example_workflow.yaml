name: "Structured Output Example"
description: "Demonstrates using Instructor for validated, typed LLM outputs"

tasks:
  - id: "extract_user_info"
    method: "llm/structured"
    parameters:
      provider: "openai"
      model: "gpt-4-turbo-preview"
      schema:
        name: "UserInfo"
        properties:
          name:
            type: "string"
            description: "Full name of the person"
          age:
            type: "integer"
            description: "Age in years"
          email:
            type: "string"
            format: "email"
            description: "Email address"
          occupation:
            type: "string"
            description: "Current job or profession"
        required: ["name", "age", "email"]
      messages:
        - role: "system"
          content: "Extract user information from the provided text."
        - role: "user"
          content: "John Doe is a 30 year old software engineer. You can reach him at john.doe@example.com"
  
  - id: "classify_sentiment"
    method: "llm/classify"
    parameters:
      provider: "openai"
      model: "gpt-3.5-turbo"
      text: "I absolutely love this new feature! It's made my workflow so much more efficient."
      categories: ["positive", "negative", "neutral", "mixed"]
  
  - id: "extract_product_review"
    method: "llm/extract"
    dependencies: ["extract_user_info"]
    parameters:
      provider: "openai"
      text: "The new iPhone 15 Pro is amazing! The camera quality is outstanding with its 48MP sensor. Battery life lasts all day. The titanium frame feels premium. Price is $999 which is expensive but worth it. I'd rate it 9/10."
      schema:
        name: "ProductReview"
        properties:
          product_name:
            type: "string"
          rating:
            type: "number"
            minimum: 0
            maximum: 10
          pros:
            type: "array"
            items:
              type: "string"
          cons:
            type: "array"
            items:
              type: "string"
          price:
            type: "number"
          recommendation:
            type: "boolean"
  
  - id: "generate_structured_story"
    method: "llm/structured"
    dependencies: ["extract_user_info"]
    parameters:
      provider: "openai"
      model: "gpt-4"
      schema:
        name: "Story"
        properties:
          title:
            type: "string"
          characters:
            type: "array"
            items:
              type: "object"
              properties:
                name:
                  type: "string"
                role:
                  type: "string"
                description:
                  type: "string"
          plot_summary:
            type: "string"
            maxLength: 500
          themes:
            type: "array"
            items:
              type: "string"
          word_count:
            type: "integer"
        required: ["title", "characters", "plot_summary"]
      messages:
        - role: "system"
          content: "Create a short story outline based on the user information."
        - role: "user"
          content: "Write a story outline about ${extract_user_info.data.name}, a ${extract_user_info.data.occupation} who discovers something unexpected."