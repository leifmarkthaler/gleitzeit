{% extends "base.html" %}

{% block title %}Tasks - Gleitzeit UI{% endblock %}

{% block content %}
<div class="tasks-page">
    <div class="page-header">
        <h1 class="page-title">Tasks</h1>
    </div>
    
    <!-- Filters -->
    <div class="filters">
        <select id="status-filter" class="filter-select" 
                hx-get="/api/tasks" 
                hx-trigger="change"
                hx-target="#tasks-list"
                hx-include="[name='limit'], [name='workflow_id']">
            <option value="">All Status</option>
            <option value="pending">Pending</option>
            <option value="running">Running</option>
            <option value="completed">Completed</option>
            <option value="failed">Failed</option>
            <option value="cancelled">Cancelled</option>
        </select>
        
        <input type="text" name="workflow_id" class="filter-input" 
               placeholder="Workflow ID (optional)"
               hx-get="/api/tasks"
               hx-trigger="change delay:500ms"
               hx-target="#tasks-list"
               hx-include="[id='status-filter'], [name='limit']">
        
        <input type="number" name="limit" value="20" min="1" max="100" 
               class="filter-input" placeholder="Limit"
               hx-get="/api/tasks"
               hx-trigger="change"
               hx-target="#tasks-list"
               hx-include="[id='status-filter'], [name='workflow_id']">
    </div>
    
    <!-- Queue Status -->
    <div class="queue-overview" 
         hx-get="/api/tasks/queue/status" 
         hx-trigger="load, every 2s"
         hx-target="this"
         hx-swap="innerHTML">
        <div class="loading-spinner">Loading queue status...</div>
    </div>
    
    <!-- Tasks List -->
    <div id="tasks-list" 
         hx-get="/api/tasks" 
         hx-trigger="load, every 3s"
         class="tasks-container">
        <div class="loading-spinner">Loading tasks...</div>
    </div>
</div>

<script>
// Format queue status
document.body.addEventListener('htmx:beforeSwap', function(evt) {
    if (evt.detail.target.classList.contains('queue-overview')) {
        const data = JSON.parse(evt.detail.xhr.response);
        const stats = data.statistics || {};
        
        let html = `
            <div class="queue-header">
                <h2>Queue Status</h2>
                <span class="queue-timestamp">Updated: ${new Date(data.timestamp).toLocaleTimeString()}</span>
            </div>
            <div class="queue-stats-grid">
                <div class="queue-stat">
                    <span class="queue-stat-value">${stats.total || 0}</span>
                    <span class="queue-stat-label">Total Tasks</span>
                </div>
                <div class="queue-stat status-pending">
                    <span class="queue-stat-value">${stats.pending || 0}</span>
                    <span class="queue-stat-label">Pending</span>
                </div>
                <div class="queue-stat status-running">
                    <span class="queue-stat-value">${stats.running || 0}</span>
                    <span class="queue-stat-label">Running</span>
                </div>
                <div class="queue-stat status-completed">
                    <span class="queue-stat-value">${stats.completed || 0}</span>
                    <span class="queue-stat-label">Completed</span>
                </div>
                <div class="queue-stat status-failed">
                    <span class="queue-stat-value">${stats.failed || 0}</span>
                    <span class="queue-stat-label">Failed</span>
                </div>
                <div class="queue-stat status-cancelled">
                    <span class="queue-stat-value">${stats.cancelled || 0}</span>
                    <span class="queue-stat-label">Cancelled</span>
                </div>
            </div>
        `;
        
        if (data.queue) {
            html += `
                <div class="queue-info">
                    <span>Queue Size: ${data.queue.queue_size || 0}</span>
                    <span>Max Workers: ${data.queue.max_workers || 'N/A'}</span>
                </div>
            `;
        }
        
        evt.detail.target.innerHTML = html;
        evt.preventDefault();
    }
    
    // Format tasks list
    if (evt.detail.target.id === 'tasks-list') {
        const data = JSON.parse(evt.detail.xhr.response);
        let html = '';
        
        if (data.tasks && data.tasks.length > 0) {
            html = '<div class="tasks-table">';
            html += `
                <div class="table-header">
                    <div class="table-row">
                        <div class="table-cell">Status</div>
                        <div class="table-cell">Task ID</div>
                        <div class="table-cell">Workflow</div>
                        <div class="table-cell">Method</div>
                        <div class="table-cell">Created</div>
                        <div class="table-cell">Actions</div>
                    </div>
                </div>
                <div class="table-body">
            `;
            
            data.tasks.forEach(task => {
                const statusClass = `status-${task.status || 'pending'}`;
                const statusIcon = getStatusIcon(task.status);
                
                html += `
                    <div class="table-row">
                        <div class="table-cell">
                            <span class="task-status ${statusClass}">
                                ${statusIcon} ${task.status || 'pending'}
                            </span>
                        </div>
                        <div class="table-cell">
                            <a href="/tasks/${task.id}" class="task-link">${task.id}</a>
                        </div>
                        <div class="table-cell">
                            ${task.workflow_id ? 
                                `<a href="/workflows/${task.workflow_id}" class="workflow-link">${task.workflow_id}</a>` : 
                                'N/A'}
                        </div>
                        <div class="table-cell">
                            <code>${task.method || 'N/A'}</code>
                        </div>
                        <div class="table-cell">
                            ${formatTime(task.created_at)}
                        </div>
                        <div class="table-cell">
                            <div class="action-buttons">
                                <a href="/tasks/${task.id}" class="btn btn-sm btn-primary">View</a>
                                ${task.status === 'failed' ? 
                                    `<button class="btn btn-sm btn-warning" 
                                             hx-post="/api/tasks/${task.id}/retry"
                                             hx-confirm="Retry this task?">Retry</button>` : ''}
                                ${task.status === 'running' || task.status === 'pending' ? 
                                    `<button class="btn btn-sm btn-danger" 
                                             hx-delete="/api/tasks/${task.id}"
                                             hx-confirm="Cancel this task?">Cancel</button>` : ''}
                            </div>
                        </div>
                    </div>
                `;
            });
            
            html += '</div></div>';
            
            // Pagination info
            html += `
                <div class="pagination-info">
                    Showing ${data.tasks.length} of ${data.total} tasks
                </div>
            `;
        } else {
            html = `
                <div class="empty-state">
                    <h3>No Tasks Found</h3>
                    <p>Tasks will appear here when workflows are executed.</p>
                </div>
            `;
        }
        
        evt.detail.target.innerHTML = html;
        evt.preventDefault();
    }
});

function getStatusIcon(status) {
    switch(status) {
        case 'completed': return '✓';
        case 'running': return '▶';
        case 'failed': return '✗';
        case 'pending': return '○';
        case 'cancelled': return '⊘';
        default: return '•';
    }
}

function formatTime(timestamp) {
    if (!timestamp) return 'N/A';
    const date = new Date(timestamp);
    return date.toLocaleTimeString();
}

// Handle task actions
document.body.addEventListener('htmx:afterRequest', function(evt) {
    // Refresh list after action
    if (evt.detail.successful && (evt.detail.verb === 'DELETE' || evt.detail.verb === 'POST')) {
        htmx.trigger('#tasks-list', 'load');
    }
});
</script>
{% endblock %}
