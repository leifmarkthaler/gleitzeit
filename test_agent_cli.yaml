name: "CLI Agent Test"
version: "1.0"
description: "Test agent workflow via CLI"

tasks:
  - id: "simple_chat"
    name: "Chat with Agent"
    protocol: "agent"
    method: "chat"
    params:
      message: "Hello! What is 2 + 2?"
      session_id: "cli_test_session"
    
  - id: "follow_up"
    name: "Follow-up Question"
    protocol: "agent"
    method: "chat"
    dependencies: ["simple_chat"]
    params:
      message: "Can you explain how you got that answer?"
      session_id: "cli_test_session"
    
  - id: "analyze"
    name: "Analyze Conversation"
    protocol: "agent"
    method: "analyze"
    dependencies: ["simple_chat", "follow_up"]
    params:
      content: "First: ${simple_chat.response}, Second: ${follow_up.response}"
      question: "Was the math correct?"