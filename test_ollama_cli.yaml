name: "CLI Ollama Test"
description: "Test Ollama workflow via CLI"
version: "1.0.0"

tasks:
  - id: "list_models"
    name: "List Available Models"
    type: "ollama"
    method: "ollama/list_models"
    params: {}

  - id: "generate_haiku"
    name: "Generate Haiku"
    type: "ollama"
    method: "ollama/generate"
    params:
      model: "llama3.2"
      prompt: "Write a haiku about technology"
      options:
        temperature: 0.7
        num_predict: 50

  - id: "chat_question"
    name: "Answer Question"
    type: "ollama"
    method: "ollama/chat"
    params:
      model: "llama3.2"
      messages:
        - role: "system"
          content: "You are a helpful assistant."
        - role: "user"
          content: "What is machine learning in one sentence?"
      options:
        temperature: 0.3
        num_predict: 40
    dependencies: ["generate_haiku"]