name: test_python_workflow_v2
description: Simple test workflow using Python tasks with correct format

tasks:
  - id: task1
    type: python
    name: "First Task"
    params:
      code: |
        print('Task 1 executed successfully')

  - id: task2
    type: python
    name: "Second Task"
    params:
      code: |
        print('Task 2 executed successfully')
    depends_on:
      - task1

  - id: task3
    type: python
    name: "Final Task"
    params:
      code: |
        print('Workflow completed!')
    depends_on:
      - task2