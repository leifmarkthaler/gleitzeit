name: "Test Simple LLM"
description: "Test a simple LLM task"
timeout: 30
wait_for_completion: true

tasks:
  - name: "simple_llm_task"
    protocol: "llm/v1"
    method: "llm/chat"
    params:
      model: "llama3.2:latest"
      messages:
        - role: "user"
          content: "Say hello in exactly 3 words"
    retry_config:
      max_attempts: 3
      initial_delay: 2
      backoff_multiplier: 2