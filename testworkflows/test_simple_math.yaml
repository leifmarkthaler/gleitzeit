name: "Simple Math Test"
description: "Test basic math with streams"
timeout: 30
wait_for_completion: true

tasks:
  - name: "add_numbers"
    protocol: "python/v1"
    method: "python/execute_code"
    params:
      code: |
        result = 10 + 20
        print(f"10 + 20 = {result}")
        result